name: Deploy

# After main advances, recreate any missing Cloudflare resources and deploy
# the REST Worker, then the MCP Worker. Idempotent: existing D1 / Vectorize
# objects are left alone. Local `wrangler dev -e dev` uses
# openbrain-memories-dev; this workflow deploys the top-level Workers against
# openbrain-memories.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build common package
        run: npm run build --workspace @snaveevans/openbrain-common

      - name: Verify Cloudflare credentials are present
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Ensure D1 and Vectorize exist
        run: bash scripts/ensure-cloudflare.sh

      - name: Apply D1 migrations
        working-directory: packages/openbrain-api
        run: |
          if compgen -G "migrations/*.sql" > /dev/null; then
            npx wrangler d1 migrations apply openbrain --remote
          else
            echo "No D1 migrations yet — skip"
          fi

      - name: Deploy Worker
        working-directory: packages/openbrain-api
        run: npx wrangler deploy --env=""

      - name: Ensure MCP KV namespace exists
        run: bash scripts/ensure-cloudflare-mcp.sh

      - name: Deploy MCP Worker
        working-directory: packages/openbrain-mcp
        run: npx wrangler deploy --env=""
