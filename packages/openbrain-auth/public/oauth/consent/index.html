<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consent | Open Brain Auth</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/assets/consent.js"></script>
  </head>
  <body>
    <main class="shell shell--centered">
      <section class="card stack-l">
        <header class="stack-s">
          <p class="eyebrow">Open Brain</p>
          <h1>Approve MCP access</h1>
          <p class="muted">
            Review the requested access before connecting the client.
          </p>
        </header>

        <section id="consent-message" class="notice" hidden></section>

        <section class="stack-m" id="loading-panel">
          <p class="muted">Loading authorization request...</p>
        </section>

        <section class="stack-m" id="consent-panel" hidden>
          <div class="detail-grid">
            <div>
              <p class="label">Application</p>
              <p class="value" id="client-name">-</p>
            </div>
            <div>
              <p class="label">Redirect URI</p>
              <p class="value value--code" id="redirect-uri">-</p>
            </div>
            <div>
              <p class="label">Authorization ID</p>
              <p class="value value--code" id="authorization-id">-</p>
            </div>
            <div>
              <p class="label">Signed in as</p>
              <p class="value" id="signed-in-email">-</p>
            </div>
          </div>

          <div class="stack-s">
            <p class="label">Requested scopes</p>
            <ul class="scope-list" id="scope-list"></ul>
          </div>

          <div class="actions">
            <button class="button button--primary" id="approve-button" type="button">Approve access</button>
            <button class="button button--secondary" id="deny-button" type="button">Deny</button>
          </div>
        </section>
      </section>
    </main>
  </body>
  </html>
